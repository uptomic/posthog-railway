name: Build deployed Node compatibility repair
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun test
      - id: inputs
        env:
          BASE: ghcr.io/posthog/posthog-node@sha256:e526ec11a5fe7cb1d60037a5977eb045c3fec13595f87b4eea01db96dfff076c
        run: |
          bun -e 'const {overlayFingerprint}=require("./images/node/apply-overlay.cjs"); console.log("fingerprint="+overlayFingerprint(process.env.BASE, process.cwd()+"/images/node"))' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: images/node
          file: images/node/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/uptomic/posthog-railway/node:repair-${{ github.sha }}
          build-args: |
            NODE_BASE_IMAGE=ghcr.io/posthog/posthog-node@sha256:e526ec11a5fe7cb1d60037a5977eb045c3fec13595f87b4eea01db96dfff076c
            NODE_BASE_REVISION=49c2532424f7f7e6825a0cd5ef61c4ba7bc212f7
            NODE_OVERLAY_SHA256=${{ steps.inputs.outputs.fingerprint }}
      - name: Record immutable repair
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Node repair image ghcr.io/uptomic/posthog-railway/node@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
