name: Build PostHog candidate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: posthog-upstream-candidate
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
      clickhouse_tag: ${{ steps.lock.outputs.clickhouse_tag }}
      commit: ${{ steps.lock.outputs.commit }}
      short: ${{ steps.lock.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - id: lock
        run: |
          bun run lock:resolve
          bun run check
          commit="$(jq -r .upstreamCommit posthog.lock.json)"
          if git diff --quiet -- posthog.lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short=${commit:0:12}" >> "$GITHUB_OUTPUT"
          clickhouse_fingerprint="$(find images -maxdepth 1 -type f -name 'clickhouse*' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)"
          echo "clickhouse_tag=sha-${commit:0:12}-bundle-${clickhouse_fingerprint}" >> "$GITHUB_OUTPUT"
      - name: Commit a changed upstream lock
        run: |
          if git diff --quiet -- posthog.lock.json; then
            exit 0
          fi
          git config user.name "uptomic-posthog-sync"
          git config user.email "engineering@uptomic.com"
          git add posthog.lock.json
          git commit -m "chore: lock PostHog upstream $(jq -r .upstreamCommit posthog.lock.json | cut -c1-12)"
          git push

  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: mcp
            dockerfile: services/mcp/Dockerfile
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        name: Reuse an existing immutable candidate
        env:
          COMPONENT: ${{ matrix.component }}
          EXPECTED_SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          image="ghcr.io/uptomic/posthog-railway/${COMPONENT}:sha-${EXPECTED_SHORT}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: ${{ steps.existing.outputs.exists != 'true' }}
        with:
          context: https://github.com/PostHog/posthog.git#${{ needs.resolve.outputs.commit }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/uptomic/posthog-railway/${{ matrix.component }}:sha-${{ needs.resolve.outputs.short }}
          build-args: |
            COMMIT_HASH=${{ needs.resolve.outputs.commit }}
          cache-from: type=gha,scope=posthog-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=posthog-${{ matrix.component }}

  build-clickhouse:
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: PostHog/posthog
          ref: ${{ needs.resolve.outputs.commit }}
          path: posthog
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        name: Resolve the candidate ClickHouse version
        run: |
          version="$(sed -nE 's/.*clickhouse\/clickhouse-server:([^} ]+).*/\1/p' posthog/docker-compose.base.yml | head -n 1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - id: existing
        name: Reuse an existing immutable candidate
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.clickhouse_tag }}
        run: |
          image="ghcr.io/uptomic/posthog-railway/clickhouse:${IMAGE_TAG}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: ${{ steps.existing.outputs.exists != 'true' }}
        with:
          context: .
          file: images/clickhouse.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/uptomic/posthog-railway/clickhouse:${{ needs.resolve.outputs.clickhouse_tag }}
          build-args: |
            CLICKHOUSE_BASE_IMAGE=clickhouse/clickhouse-server:${{ steps.version.outputs.value }}
            COMMIT_HASH=${{ needs.resolve.outputs.commit }}
          cache-from: type=gha,scope=posthog-clickhouse
          cache-to: type=gha,mode=max,scope=posthog-clickhouse

  verify:
    needs: [resolve, build, build-clickhouse]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: [clickhouse, mcp]
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable candidate
        env:
          COMPONENT: ${{ matrix.component }}
          CLICKHOUSE_TAG: ${{ needs.resolve.outputs.clickhouse_tag }}
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
          EXPECTED_SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          case "$COMPONENT" in
            clickhouse) image="ghcr.io/uptomic/posthog-railway/clickhouse:${CLICKHOUSE_TAG}" ;;
            mcp) image="ghcr.io/uptomic/posthog-railway/mcp:sha-${EXPECTED_SHORT}" ;;
            *) exit 1 ;;
          esac
          docker pull "$image"
          case "$COMPONENT" in
            clickhouse)
              commit_file=/etc/uptomic-posthog-commit
              docker run --rm --entrypoint sh "$image" -c \
                'grep -q "<background_schedule_pool_size>128</background_schedule_pool_size>" /etc/clickhouse-server/config.d/zz-railway-runtime.xml && grep -q "<listen_host replace=\"replace\">0.0.0.0</listen_host>" /etc/clickhouse-server/config.d/zz-railway-runtime.xml && grep -q "clickhouse-official-entrypoint.sh" /entrypoint.sh && grep -q "127.0.0.1" /etc/clickhouse-server/users.d/zz-railway-dictionary-user.xml'
              test "$(docker run --rm -e RAILWAY_PRIVATE_DOMAIN=clickhouse.railway.internal -e CLICKHOUSE_USER=clickhouse -e CLICKHOUSE_PASSWORD=test-only -e KAFKA_HOSTS=localhost:9092 "$image" clickhouse extract-from-config --config-file=/etc/clickhouse-server/config.xml --key=remote_servers.posthog.shard.replica.host)" = clickhouse.railway.internal
              test "$(docker run --rm -e RAILWAY_PRIVATE_DOMAIN=clickhouse.railway.internal -e CLICKHOUSE_USER=clickhouse -e CLICKHOUSE_PASSWORD=test-only -e KAFKA_HOSTS=localhost:9092 "$image" clickhouse extract-from-config --config-file=/etc/clickhouse-server/config.xml --key=remote_servers.posthog.shard.replica.user)" = clickhouse
              test "$(docker run --rm -e RAILWAY_PRIVATE_DOMAIN=clickhouse.railway.internal -e CLICKHOUSE_USER=clickhouse -e CLICKHOUSE_PASSWORD=test-only -e KAFKA_HOSTS=localhost:9092 "$image" clickhouse extract-from-config --config-file=/etc/clickhouse-server/config.xml --key=remote_servers.posthog.shard.replica.password)" = test-only
              container=posthog-clickhouse-candidate
              docker rm -f "$container" >/dev/null 2>&1 || true
              docker run -d --name "$container" \
                -e RAILWAY_PRIVATE_DOMAIN=clickhouse.railway.internal \
                -e CLICKHOUSE_USER=clickhouse \
                -e CLICKHOUSE_PASSWORD=test-only \
                -e KAFKA_HOSTS=localhost:9092 \
                "$image" clickhouse-server --config-file=/etc/clickhouse-server/config.xml
              trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
              for _ in $(seq 1 60); do
                if docker exec "$container" clickhouse-client --user clickhouse --password test-only --query 'SELECT 1' >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              test "$(docker exec "$container" clickhouse-client --user clickhouse --password test-only --query "SELECT host_name FROM system.clusters WHERE cluster = 'posthog' LIMIT 1")" = clickhouse.railway.internal
              test "$(docker exec "$container" clickhouse-client --user clickhouse --password test-only --query "SELECT is_local FROM system.clusters WHERE cluster = 'posthog' LIMIT 1")" = 1
              test "$(docker exec "$container" clickhouse-client --user clickhouse --password test-only --query "SELECT count() FROM clusterAllReplicas('posthog', system.one)")" = 1
              test "$(docker exec "$container" clickhouse-client --user default --query 'SELECT 1')" = 1
              docker rm -f "$container" >/dev/null
              trap - EXIT
              ;;
            mcp) commit_file=/code/commit.txt ;;
            *) exit 1 ;;
          esac
          docker run --rm --entrypoint sh "$image" -c \
            'test "$(cat "$1")" = "$2"' _ "$commit_file" "$EXPECTED_COMMIT"
          docker image inspect "$image" --format '{{json .RepoDigests}}'

  finalize:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lock the verified candidate digests
        env:
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
          EXPECTED_SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          mcp_digest="$(docker buildx imagetools inspect \
            "ghcr.io/uptomic/posthog-railway/mcp:sha-${EXPECTED_SHORT}" \
            --format '{{json .Manifest}}' | jq -er .digest)"
          clickhouse_digest="$(docker buildx imagetools inspect \
            "ghcr.io/uptomic/posthog-railway/clickhouse:${{ needs.resolve.outputs.clickhouse_tag }}" \
            --format '{{json .Manifest}}' | jq -er .digest)"
          export MCP_DIGEST="$mcp_digest"
          export CLICKHOUSE_DIGEST="$clickhouse_digest"
          bun scripts/write-candidate.ts
          bun run candidate:verify
      - name: Commit the candidate manifest
        run: |
          if git diff --quiet -- posthog.candidate.json; then
            exit 0
          fi
          git config user.name "uptomic-posthog-sync"
          git config user.email "engineering@uptomic.com"
          git add posthog.candidate.json
          git commit -m "chore: lock built PostHog candidate $(jq -r .upstreamCommit posthog.candidate.json | cut -c1-12)"
          git push
